# TURN server configuration for Nostr VOIP
# This file is used by the coturn container

listening-port=3478
listening-ip=0.0.0.0

# TLS settings (for TURN over TLS)
tls-listening-port=5349
tls-cert-file=/etc/ssl/certs/cert.pem
tls-key-file=/etc/ssl/private/key.pem

# Relay settings
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=voip-secret
realm=nostr-voip

# User database (if needed)
userdb=/var/lib/turn/turndb

# STUN/TURN functionality
no-loopback-peers
no-multicast-peers

# Logging
log-file=/var/log/turnserver/turn.log
syslog
# Simple log format for better readability
simple-log

# Network settings
no-cli
pidfile=/var/run/turnserver/turnserver.pid

# Allow anonymous access for development
# In production, you should use proper authentication
no-auth
# OR use authentication (uncomment below and remove no-auth)
# user=voip-user:voip-secret

# STUN only port (for clients that don't need TURN)
stun-only

# Enable long-term credential mechanism
lt-cred-mech

# Mobility with ICE (ICE mobility)
mobility

# Allow TCP and UDP connections
no-tlsv1
no-tlsv1_1
no-tlsv1_2

# Set the maximum number of sessions
max-bps=0
bps-capacity=0

# Set the maximum number of clients
max-allocate-lifetime=3600
no-multicast-peers

# Enable verbose logging for debugging (comment out for production)
# verbose